<style>
  :root{
    /* 朝凪の水面 -- 瀬戸内海をイメージした配色(STU48) */
    --bg-top: #eef8f8;
    --bg-bottom: #d7ecec;
    --surface: #ffffff;
    --surface-line: #d8ebec;
    --ink: #163538;
    --ink-dim: #6f9296;
    --ink-strong: #0e2a2d;
    --sand: #dba05a;
    --sand-deep: #b97f3d;
    --foam: rgba(255,255,255,0.7);
    --chip-bg: #f3fafa;
    --chip-hover-border: #b7d6d8;
    --placeholder-color: #9db4b6;
    --muted-icon: #b9d0d2;
    --footer-color: #8fa9ab;
    --wave-a: #2bc0d8;
    --wave-b: #dba05a;
    --tab-active-fg: #eef8f8;
    --ink-rgb: 22,80,90;
    --accent-rgb: 219,160,90;

    --c-blue:#2f6bff;
    --c-white:#c9d6d2;
    --c-red:#ef2e4e;
    --c-yellow:#e8b93c;
    --c-green:#2fae72;
    --c-darkgreen:#1f7a4a;
    --c-black:#22242a;
    --c-purple:#a35bf0;
    --c-pink:#ff6fb0;
    --c-darkpink:#ef2e91;
    --c-lightpink:#ffb8d6;
    --c-mizu:#2bc0d8;
    --c-pastelblue:#a9d9ef;
    --c-lightblue:#5ba9e6;
    --c-hotpink:#ff2f8f;
    --c-turquoise:#17b8a5;
    --c-lavender:#b9a6e8;
    --c-orange:#ff9640;
    --c-emerald:#0fbf83;
    --c-lightgreen:#7bd898;
    --c-violet:#7c4dff;
    --c-momo:#ff8fa3;
    --c-undecided:#9db8bb;
  }

  /* 薄い桜色をベースにした配色(AKB48) */
  body.theme-akb48{
    --bg-top: #fdf2f6;
    --bg-bottom: #f6d9e6;
    --surface: #ffffff;
    --surface-line: #f4d7e3;
    --ink: #4a2530;
    --ink-dim: #b9899a;
    --ink-strong: #4a2530;
    --sand: #d6688b;
    --sand-deep: #b84c6f;

    --chip-hover-border: #eab8cc;

    --muted-icon: #e3b9c9;
    --footer-color: #b98a9a;
    --wave-a: #f4a7c0;
    --wave-b: #d6688b;
    --tab-active-fg: #fdf2f6;
    --ink-rgb: 74,37,48;
    --accent-rgb: 214,104,139;
  }

  /* トキの朱鷺色をベースにした配色(NGT48) */
  body.theme-ngt48{
    --bg-top: #ffe8e8;
    --bg-bottom: #ffbdbd;
    --surface: #ffffff;
    --surface-line: #f5b3b3;
    --ink: #3a0f18;
    --ink-dim: #a8646d;
    --ink-strong: #3a0f18;
    --sand: #c0242a;
    --sand-deep: #8f1418;
    --chip-bg: #ffecec;
    --chip-hover-border: #e88f8f;
    --placeholder-color: #c77d7d;
    --muted-icon: #e2999b;
    --footer-color: #ad767a;
    --wave-a: #ff8f8f;
    --wave-b: #c0242a;
    --tab-active-fg: #ffe8e8;
    --ink-rgb: 58,15,24;
    --accent-rgb: 192,36,42;
  }

  /* ヒョウ柄をイメージしたキャメル・ブラウン配色(NMB48) */
  body.theme-nmb48{
    --bg-top: #faf1de;
    --bg-bottom: #ecd6a4;
    --surface: #fffdf8;
    --surface-line: #e3c584;
    --ink: #3d2411;
    --ink-dim: #a9855a;
    --ink-strong: #3d2411;
    --sand: #8a5a2b;
    --sand-deep: #5c3a1a;
    --chip-bg: #fbf2df;
    --chip-hover-border: #d9b876;
    --placeholder-color: #c2a06c;
    --muted-icon: #d9bd8c;
    --footer-color: #a98a5c;
    --wave-a: #d9a54a;
    --wave-b: #5c3a1a;
    --tab-active-fg: #faf1de;
    --ink-rgb: 61,36,17;
    --accent-rgb: 138,90,43;
  }

  /* オレンジをベースにした配色(SKE48) */
  body.theme-ske48{
    --bg-top: #fff3e6;
    --bg-bottom: #ffd6ad;
    --surface: #ffffff;
    --surface-line: #ffcb96;
    --ink: #5a2e0a;
    --ink-dim: #c4915f;
    --ink-strong: #5a2e0a;
    --sand: #e2680f;
    --sand-deep: #b04e08;
    --chip-bg: #fff6ec;
    --chip-hover-border: #ffbd7a;
    --placeholder-color: #d9a06a;
    --muted-icon: #f2c090;
    --footer-color: #c98c55;
    --wave-a: #ffb066;
    --wave-b: #e2680f;
    --tab-active-fg: #fff3e6;
    --ink-rgb: 90,46,10;
    --accent-rgb: 226,104,15;
  }

  /* 白黒モノトーンをベースにした配色(HKT48) */
  body.theme-hkt48{
    --bg-top: #ffffff;
    --bg-bottom: #e2e2e2;
    --surface: #ffffff;
    --surface-line: #d4d4d4;
    --ink: #1a1a1a;
    --ink-dim: #8a8a8a;
    --ink-strong: #101010;
    --sand: #1f1f1f;
    --sand-deep: #000000;
    --chip-bg: #f4f4f4;
    --chip-hover-border: #b8b8b8;
    --placeholder-color: #a0a0a0;
    --muted-icon: #c2c2c2;
    --footer-color: #9a9a9a;
    --wave-a: #4d4d4d;
    --wave-b: #000000;
    --tab-active-fg: #ffffff;
    --ink-rgb: 26,26,26;
    --accent-rgb: 31,31,31;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255,255,255,0.9), transparent 55%),
      linear-gradient(180deg, var(--bg-top), var(--bg-bottom) 70%);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
    transition:background .3s ease;
  }

  .stagelight{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(circle at 12% 15%, rgba(255,255,255,0.55), transparent 40%),
      radial-gradient(circle at 88% 8%, rgba(255,255,255,0.4), transparent 35%),
      radial-gradient(circle at 50% 100%, rgba(var(--accent-rgb),0.06), transparent 45%);
  }

  /* ヒョウ柄パターン(NMB48限定・控えめな透明度) */
  body.theme-nmb48 .stagelight{
    background:
      radial-gradient(circle at 12% 15%, rgba(255,255,255,0.35), transparent 40%),
      radial-gradient(circle at 88% 8%, rgba(255,255,255,0.22), transparent 35%),
      radial-gradient(ellipse 16px 12px at 8% 10%, rgba(61,36,17,0.75) 55%, transparent 60%),
      radial-gradient(ellipse 12px 9px at 7% 7%, rgba(217,165,74,0.65) 40%, transparent 55%),

      radial-gradient(ellipse 10px 8px at 27% 19%, rgba(217,165,74,0.6) 40%, transparent 55%),
      radial-gradient(ellipse 17px 12px at 52% 8%, rgba(61,36,17,0.7) 55%, transparent 60%),
      radial-gradient(ellipse 13px 9px at 51% 5%, rgba(217,165,74,0.6) 40%, transparent 55%),
      radial-gradient(ellipse 11px 15px at 72% 26%, rgba(61,36,17,0.72) 55%, transparent 60%),
      radial-gradient(ellipse 8px 11px at 74% 23%, rgba(217,165,74,0.55) 40%, transparent 55%),
      radial-gradient(ellipse 14px 10px at 92% 12%, rgba(61,36,17,0.68) 55%, transparent 60%),
      radial-gradient(ellipse 10px 7px at 90% 9%, rgba(217,165,74,0.55) 40%, transparent 55%),
      radial-gradient(ellipse 14px 10px at 14% 42%, rgba(61,36,17,0.65) 55%, transparent 60%),
      radial-gradient(ellipse 11px 8px at 12% 39%, rgba(217,165,74,0.55) 40%, transparent 55%),
      radial-gradient(ellipse 12px 16px at 40% 48%, rgba(61,36,17,0.7) 55%, transparent 60%),
      radial-gradient(ellipse 9px 12px at 38% 45%, rgba(217,165,74,0.58) 40%, transparent 55%),
      radial-gradient(ellipse 16px 11px at 63% 44%, rgba(61,36,17,0.68) 55%, transparent 60%),
      radial-gradient(ellipse 12px 8px at 62% 41%, rgba(217,165,74,0.55) 40%, transparent 55%),
      radial-gradient(ellipse 11px 15px at 85% 52%, rgba(61,36,17,0.7) 55%, transparent 60%),
      radial-gradient(ellipse 8px 11px at 87% 49%, rgba(217,165,74,0.55) 40%, transparent 55%),
      radial-gradient(ellipse 15px 10px at 20% 68%, rgba(61,36,17,0.68) 55%, transparent 60%),
      radial-gradient(ellipse 11px 7px at 18% 65%, rgba(217,165,74,0.55) 40%, transparent 55%),
      radial-gradient(ellipse 13px 17px at 46% 74%, rgba(61,36,17,0.7) 55%, transparent 60%),
      radial-gradient(ellipse 10px 13px at 44% 71%, rgba(217,165,74,0.58) 40%, transparent 55%),
      radial-gradient(ellipse 17px 12px at 70% 70%, rgba(61,36,17,0.68) 55%, transparent 60%),
      radial-gradient(ellipse 13px 9px at 69% 67%, rgba(217,165,74,0.55) 40%, transparent 55%),
      radial-gradient(ellipse 12px 9px at 94% 68%, rgba(61,36,17,0.62) 55%, transparent 60%),
      radial-gradient(ellipse 9px 6px at 92% 65%, rgba(217,165,74,0.5) 40%, transparent 55%),
      radial-gradient(ellipse 14px 10px at 10% 90%, rgba(61,36,17,0.65) 55%, transparent 60%),
      radial-gradient(ellipse 10px 7px at 8% 87%, rgba(217,165,74,0.52) 40%, transparent 55%),
      radial-gradient(ellipse 12px 16px at 33% 92%, rgba(61,36,17,0.65) 55%, transparent 60%),
      radial-gradient(ellipse 9px 12px at 31% 89%, rgba(217,165,74,0.52) 40%, transparent 55%),
      radial-gradient(ellipse 16px 11px at 58% 94%, rgba(61,36,17,0.65) 55%, transparent 60%),
      radial-gradient(ellipse 12px 8px at 57% 91%, rgba(217,165,74,0.52) 40%, transparent 55%),
      radial-gradient(ellipse 11px 15px at 82% 90%, rgba(61,36,17,0.62) 55%, transparent 60%),
      radial-gradient(ellipse 8px 11px at 84% 87%, rgba(217,165,74,0.5) 40%, transparent 55%);
    background-size: 100% 100%, 100% 100%, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px;
    background-repeat: no-repeat, no-repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat;
    opacity:.7;
  }



  .wrap{
    position:relative; z-index:1; max-width:920px; margin:0 auto;
    padding:36px 20px 80px;
    padding-left:max(20px, env(safe-area-inset-left));
    padding-right:max(20px, env(safe-area-inset-right));
    padding-bottom:max(80px, calc(80px + env(safe-area-inset-bottom)));
  }

  header{ text-align:center; margin-bottom:8px; }
  .eyebrow{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    letter-spacing:.32em;
    font-size:11px;
    color:var(--sand-deep);
    text-transform:uppercase;
    margin-bottom:12px;
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:clamp(24px, 5vw, 38px);
    margin:0 0 10px;
    letter-spacing:.04em;
    color:var(--ink-strong);
    text-shadow: 0 1px 0 rgba(255,255,255,0.6);
  }
  header p{
    color:var(--ink-dim);
    font-size:14px;
    margin:0;
    line-height:1.7;
  }

  /* 凪(なぎ) -- 静かな水面の一本線。このページの署名的モチーフ */
  .nagi{
    display:block;
    width:100%;
    max-width:360px;
    height:20px;
    margin:22px auto 32px;
    overflow:visible;
  }
  .nagi path{
    fill:none;
    stroke:url(#nagiGradient);
    stroke-width:1.4;
    stroke-linecap:round;
    animation:nagi-drift 7s ease-in-out infinite;
  }
  @keyframes nagi-drift{
    0%,100%{ transform:translateX(0) scaleY(1); }
    50%{ transform:translateX(6px) scaleY(1.4); }
  }

  .group-tabs{
    display:flex;
    gap:8px;
    margin-bottom:18px;
  }
  .group-tab{
    flex:1;
    min-height:44px;
    border:1px solid var(--surface-line);
    background:var(--surface);
    color:var(--ink-dim);
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:.04em;
    border-radius:14px;
    cursor:pointer;
    touch-action:manipulation;
    transition:background .15s ease, border-color .15s ease, color .15s ease, transform .15s ease;
  }
  .group-tab:active{ transform:scale(.98); }
  .group-tab.active{
    background:var(--ink-strong);
    border-color:var(--ink-strong);
    color:var(--tab-active-fg);
    box-shadow: 0 8px 20px -12px rgba(var(--ink-rgb),0.5);
  }

  .panel{
    background:var(--surface);
    border:1px solid var(--surface-line);
    border-radius:20px;
    padding:20px;
    margin-bottom:22px;
    box-shadow: 0 12px 32px -20px rgba(var(--ink-rgb),0.25);
  }

  .search-row{
    display:flex; align-items:center; gap:10px;
    background:var(--chip-bg);
    border:1px solid var(--surface-line);
    border-radius:999px;
    padding:12px 18px;
  }
  .search-row svg{flex:none; opacity:.55; color:var(--ink-dim);}
  .search-row input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:16px;
  }
  .search-row input::placeholder{color:var(--placeholder-color);}

  .filter-label{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:11px;
    letter-spacing:.18em;
    color:var(--ink-dim);
    text-transform:uppercase;
    margin:20px 0 10px;
  }

  .filter-group{ margin-top:4px; }
  .filter-group summary.filter-label{
    display:flex; align-items:center; justify-content:space-between;
    cursor:pointer;
    list-style:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    padding:4px 0;
  }
  .filter-group summary.filter-label::-webkit-details-marker{ display:none; }
  .filter-group summary.filter-label::after{
    content:"";
    width:7px; height:7px;
    border-right:1.6px solid var(--ink-dim);
    border-bottom:1.6px solid var(--ink-dim);
    transform:rotate(45deg);
    transition:transform .2s ease;
    flex:none;
    margin-left:10px;
  }
  .filter-group[open] summary.filter-label::after{ transform:rotate(-135deg); }
  .filter-group .chips{ margin-top:10px; }

  .chips{display:flex; flex-wrap:wrap; gap:10px;}
  .chip{
    display:inline-flex; align-items:center; gap:8px;
    min-height:38px;
    padding:8px 14px 8px 8px;
    border-radius:999px;
    border:1px solid var(--surface-line);
    background:var(--chip-bg);
    color:var(--ink);
    font-size:13px;
    cursor:pointer;
    touch-action:manipulation;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
    user-select:none;
  }
  @media (hover:hover) and (pointer:fine){
    .chip:hover{transform:translateY(-1px); border-color:var(--chip-hover-border);}
  }
  .chip:active{transform:scale(.97);}
  .chip .dot{
    width:16px; height:16px; border-radius:50%; flex:none;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5), 0 0 0 1px rgba(var(--ink-rgb),0.08);
  }
  .chip.active{
    background:rgba(var(--accent-rgb),0.14);
    border-color:var(--sand);
    color:var(--sand-deep);
  }
  .chip.active .dot{ box-shadow: 0 0 0 2px var(--chip-bg), 0 0 0 3px var(--sand), inset 0 0 0 1px rgba(255,255,255,0.4); }

  .count-row{
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:8px;
    margin: 4px 2px 16px;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:12px;
    color:var(--ink-dim);
  }
  .count-row b{color:var(--sand-deep); font-weight:700;}
  .clear-btn{
    display:inline-flex; align-items:center; gap:6px;
    min-height:36px;
    background:var(--surface); border:1px solid var(--sand);
    color:var(--sand-deep);
    font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:12px;
    border-radius:999px;
    padding:6px 16px;
    cursor:pointer;
    touch-action:manipulation;
    transition:background .15s ease, transform .15s ease;
  }
  @media (hover:hover) and (pointer:fine){
    .clear-btn:hover{ background:rgba(var(--accent-rgb),0.14); transform:translateY(-1px); }
  }
  .clear-btn:active{ transform:scale(.97); }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(200px,1fr));
    gap:14px;
  }

  .chip.fav-toggle{
    font-family:'Zen Kaku Gothic New', sans-serif;
    border:none;
  }
  .heart-icon{ font-size:14px; line-height:1; }
  .chip.fav-toggle #favCount{
    color:var(--sand-deep);
    font-size:11px;
  }
  .chip.fav-toggle.active .heart-icon{ color:var(--sand); }

  .fav-btn{
    position:absolute; top:6px; right:6px; z-index:2;
    width:36px; height:36px;
    border-radius:50%;
    border:1px solid var(--surface-line);
    background:rgba(255,255,255,0.85);
    color:var(--muted-icon);
    font-size:16px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    touch-action:manipulation;
    transition:transform .15s ease, color .15s ease, border-color .15s ease;
    padding:0;
  }
  @media (hover:hover) and (pointer:fine){
    .fav-btn:hover{ transform:scale(1.08); }
  }
  .fav-btn:active{ transform:scale(.94); }
  .fav-btn.active{
    color:var(--sand-deep);
    border-color:var(--sand);
    background:rgba(var(--accent-rgb),0.14);
  }

  .card{
    position:relative;
    overflow:hidden;
    border-radius:16px;
    border:1px solid var(--surface-line);
    background:var(--surface);
    padding:20px 16px 16px;
    min-height:132px;
    display:flex; flex-direction:column; justify-content:flex-end;
    box-shadow: 0 10px 24px -20px rgba(var(--ink-rgb),0.3);
    transition:transform .18s ease, opacity .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  @media (hover:hover) and (pointer:fine){
    .card:hover{transform:translateY(-3px); border-color:var(--chip-hover-border); box-shadow: 0 16px 30px -18px rgba(var(--ink-rgb),0.35);}
    .card:hover::after{ opacity:1; transform:scaleX(1); }
  }
  .card:active{ transform:scale(.985); }
  .card::after{
    content:"";
    position:absolute; left:16px; right:16px; bottom:12px; height:1px;
    background:linear-gradient(90deg, transparent, rgba(43,192,216,0.35), transparent);
    opacity:0;
    transform:scaleX(.7);
    transition:opacity .25s ease, transform .25s ease;
  }
  .card:hover::after{ opacity:1; transform:scaleX(1); }
  .card.dim{opacity:.28;}
  .card.undecided{border-style:dashed;}

  .glow{
    position:absolute; inset:-30% -20% auto -20%; height:80%;
    filter:blur(26px);
    opacity:.4;
    mix-blend-mode:multiply;
    pointer-events:none;
  }
  .glow span{
    position:absolute;
    width:58%; height:58%;
    border-radius:50%;
    top:0;
  }

  .gen{
    position:relative;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:10.5px;
    letter-spacing:.08em;

const GROUPS = {
  stu48: { label:"STU48", members: MEMBERS_STU48 },
  akb48: { label:"AKB48", members: MEMBERS_AKB48 },
  ngt48: { label:"NGT48", members: MEMBERS_NGT48 },
  nmb48: { label:"NMB48", members: MEMBERS_NMB48 },
  ske48: { label:"SKE48", members: MEMBERS_SKE48 },
  hkt48: { label:"HKT48", members: MEMBERS_HKT48 },
};
let activeGroup = 'stu48';

let activeColor = null;
let activeGen = null;
let searchTerm = "";

const FAV_KEY = 'oshi-penlight-favorites';
let favorites = new Set();
try{
  favorites = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]'));
}catch(e){ favorites = new Set(); }
let showFavOnly = false;

function currentMembers(){ return GROUPS[activeGroup].members; }
function favId(name){ return `${activeGroup}::${name}`; }

const chipsEl = document.getElementById('chips');
const genChipsEl = document.getElementById('genChips');
const gridEl = document.getElementById('grid');
const countEl = document.getElementById('countNum');
const totalEl = document.getElementById('totalNum');
const emptyEl = document.getElementById('emptyMsg');
const favToggleEl = document.getElementById('favToggle');
const favToggleIconEl = document.getElementById('favToggleIcon');
const favCountEl = document.getElementById('favCount');

function saveFavorites(){
  try{ localStorage.setItem(FAV_KEY, JSON.stringify([...favorites])); }catch(e){}
}

function toggleFavorite(id){
  if(favorites.has(id)) favorites.delete(id);
  else favorites.add(id);
  saveFavorites();
  render();
}

function buildChips(){
  Object.entries(COLOR_META).forEach(([key, meta])=>{
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.dataset.color = key;
    chip.innerHTML = `<span class="dot" style="background:${meta.hex}"></span>${meta.label}`;
    chip.addEventListener('click', ()=>{
      activeColor = (activeColor === key) ? null : key;
      render();
    });
    chipsEl.appendChild(chip);
  });
}

function buildGenChips(){
  genChipsEl.innerHTML = '';
  const gens = [...new Set(currentMembers().map(m => m.gen))];
  gens.forEach(gen=>{
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.dataset.gen = gen;
    chip.textContent = gen;
    chip.addEventListener('click', ()=>{
      activeGen = (activeGen === gen) ? null : gen;
      render();
    });
    genChipsEl.appendChild(chip);
  });
}

function matches(member){
  const term = searchTerm.trim();
  const nameOk = member.name.includes(term) || (member.nickname && member.nickname.includes(term));
  const colorOk = !activeColor
    || (member.colors && member.colors.includes(activeColor))
    || (member.optional && member.optional.includes(activeColor));
  const genOk = !activeGen || member.gen === activeGen;
  const favOk = !showFavOnly || favorites.has(favId(member.name));
  return nameOk && colorOk && genOk && favOk;
}

function renderGlow(colors){
  if(!colors){
    return `<span style="left:10%; top:10%; background:var(--c-undecided);"></span>`;
  }
  const positions = [
    {left:'0%', top:'0%'},
    {left:'40%', top:'10%'},
    {left:'15%', top:'25%'},
  ];
  return colors.slice(0,3).map((c,i)=>{
    const hex = COLOR_META[c].hex;
    const p = positions[i] || positions[0];
    return `<span style="left:${p.left}; top:${p.top}; background:${hex};"></span>`;
  }).join('');
}

function render(){
  document.querySelectorAll('#groupTabs .group-tab').forEach(tab=>{
    tab.classList.toggle('active', tab.dataset.group === activeGroup);
  });
  document.querySelectorAll('#chips .chip').forEach(chip=>{
    chip.classList.toggle('active', chip.dataset.color === activeColor);
  });
  document.querySelectorAll('#genChips .chip').forEach(chip=>{
    chip.classList.toggle('active', chip.dataset.gen === activeGen);
  });
  favToggleEl.classList.toggle('active', showFavOnly);
  favToggleIconEl.textContent = showFavOnly ? '♥' : '♡';
  const favCountInGroup = [...favorites].filter(id => id.startsWith(activeGroup + '::')).length;
  favCountEl.textContent = favCountInGroup ? `（${favCountInGroup}人）` : '';

  const filtered = currentMembers().filter(matches);
  countEl.textContent = filtered.length;
  totalEl.textContent = currentMembers().length;

  gridEl.innerHTML = '';
  if(filtered.length === 0){
    emptyEl.textContent = currentMembers().length === 0
      ? `${GROUPS[activeGroup].label}のメンバーデータは準備中です。`
      : '該当するメンバーが見つかりませんでした。';
    emptyEl.style.display = 'block';
  } else {
    emptyEl.style.display = 'none';
    filtered.forEach(m=>{
      const card = document.createElement('div');
      card.className = 'card' + (!m.colors ? ' undecided' : '');

      let swatches, colorLine;
      if(m.colors){
        swatches = m.colors.map(c=>{
          const hex = COLOR_META[c].hex;
          return `<span class="swatch" style="background:${hex}; --sc:${hex}"></span>`;
        }).join('');
        colorLine = `（${m.colors.map(c=>COLOR_META[c].label).join('/')}）`;
        if(m.optional && m.optional.length){
          swatches += m.optional.map(c=>{
            const hex = COLOR_META[c].hex;
            return `<span class="swatch optional" style="--sc:${hex}"></span>`;
          }).join('');
          colorLine = `（${m.colors.map(c=>COLOR_META[c].label).join('/')}＋オプション：${m.optional.map(c=>COLOR_META[c].label).join('/')}）`;
        }
      } else {
        swatches = `<span class="swatch undecided"></span>`;
        colorLine = `（未発表）`;
      }

      const id = favId(m.name);
      const isFav = favorites.has(id);
      card.innerHTML = `
        <button class="fav-btn${isFav ? ' active' : ''}" data-id="${id}" aria-label="${m.name}を推しメンに登録">${isFav ? '♥' : '♡'}</button>
        <div class="glow">${renderGlow(m.colors)}</div>
        <div class="gen">${m.gen}</div>
        <div class="name">${m.name}<span class="nickname">${m.nickname}</span></div>
        <div class="colorname${!m.colors ? ' na' : ''}">${colorLine}</div>
        <div class="swatches">${swatches}</div>
      `;
      gridEl.appendChild(card);
    });
  }
}

gridEl.addEventListener('click', (e)=>{
  const btn = e.target.closest('.fav-btn');
  if(btn){ toggleFavorite(btn.dataset.id); }
});

favToggleEl.addEventListener('click', ()=>{
  showFavOnly = !showFavOnly;
  render();
});

document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchTerm = e.target.value;
  render();
});

document.getElementById('clearBtn').addEventListener('click', ()=>{
  searchTerm = '';
  activeColor = null;
  activeGen = null;
  showFavOnly = false;
  document.getElementById('searchInput').value = '';
  render();
});

const groupTabsEl = document.getElementById('groupTabs');
const h1El = document.getElementById('mainTitle');
groupTabsEl.querySelectorAll('.group-tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    const group = tab.dataset.group;
    if(group === activeGroup) return;
    activeGroup = group;
    activeColor = null;
    activeGen = null;
    searchTerm = '';
    showFavOnly = false;
    document.getElementById('searchInput').value = '';
    document.body.classList.remove('theme-akb48', 'theme-ngt48', 'theme-nmb48', 'theme-ske48', 'theme-hkt48');
    if(activeGroup !== 'stu48'){ document.body.classList.add(`theme-${activeGroup}`); }
    h1El.textContent = `${GROUPS[activeGroup].label} 推しペンラサーチ`;
    document.title = `${GROUPS[activeGroup].label} 推しペンラサーチ`;
    buildGenChips();
    render();
  });
});

buildChips();
buildGenChips();
render();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
